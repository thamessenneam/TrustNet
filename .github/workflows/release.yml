name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  # ── Windows: .exe + Inno Setup installer ───────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build trustnet.exe
        run: |
          pyinstaller --onefile --noconsole --name trustnet `
            --hidden-import trustnet.network.node `
            --hidden-import trustnet.network.ledger `
            --hidden-import trustnet.network.client `
            --hidden-import trustnet.network.discovery `
            --hidden-import trustnet.network.protocol `
            --hidden-import zeroconf `
            --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 `
            trustnet.py

      - name: Build Setup Wizard exe
        run: |
          pyinstaller --onefile --noconsole --name TrustNet-Setup `
            --hidden-import trustnet.core `
            --hidden-import trustnet.network.node `
            --hidden-import trustnet.network.ledger `
            --hidden-import trustnet.network.client `
            --hidden-import trustnet.network.discovery `
            --hidden-import trustnet.network.protocol `
            --hidden-import zeroconf `
            --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 `
            setup_wizard.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/TrustNet-Setup.exe

  # ── macOS: binary + .pkg installer ────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --noconsole --name trustnet \
            --hidden-import trustnet.network.node \
            --hidden-import trustnet.network.ledger \
            --hidden-import trustnet.network.client \
            --hidden-import trustnet.network.discovery \
            --hidden-import trustnet.network.protocol \
            --hidden-import zeroconf \
            --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 \
            trustnet.py

      - name: Build .pkg installer
        run: |
          cd install/macos
          chmod +x build_pkg.sh
          ./build_pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/TrustNet-1.0.0.pkg

  # ── Linux: binary + .deb package ─────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build binary
        run: |
          pyinstaller --onefile --noconsole --name trustnet \
            --hidden-import trustnet.network.node \
            --hidden-import trustnet.network.ledger \
            --hidden-import trustnet.network.client \
            --hidden-import trustnet.network.discovery \
            --hidden-import trustnet.network.protocol \
            --hidden-import zeroconf \
            --hidden-import cryptography.hazmat.primitives.asymmetric.ed25519 \
            trustnet.py

      - name: Build .deb package
        run: |
          cd install/linux
          chmod +x build_deb.sh
          ./build_deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: dist/trustnet_1.0.0_amd64.deb

  # ── Publish GitHub Release ─────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TrustNet ${{ github.ref_name }}"
          body: |
            ## TrustNet ${{ github.ref_name }}

            Decentralized cryptographic file & package trust network.

            ### Install

            | Platform | Installer | What to do |
            |---|---|---|
            | Windows | `TrustNet-Setup.exe` | Double-click → follow the wizard |
            | macOS   | `TrustNet-1.0.0.pkg` | Double-click → Continue → Install |
            | Linux   | `trustnet_1.0.0_amd64.deb` | `sudo dpkg -i trustnet_1.0.0_amd64.deb` |

            The installer:
            - Installs TrustNet (no Python required)
            - Adds right-click menu to your file manager
            - Generates your cryptographic key automatically
            - Starts the P2P node in the background

            ### Via pip (developers)
            ```bash
            pip install trustnet==${{ github.ref_name }}
            ```
          files: |
            artifacts/windows-installer/TrustNet-Setup.exe
            artifacts/macos-installer/TrustNet-1.0.0.pkg
            artifacts/linux-installer/trustnet_1.0.0_amd64.deb
          draft: false
          prerelease: false
